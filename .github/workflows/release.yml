name: Publicar ByaFlux
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - package.json
      - mod/package.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: byaflux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/configure.mjs
      - run: npm install --global pnpm@12.18.0
      - run: pnpm --dir mod install --frozen-lockfile
      - run: pnpm --dir mod testTsc
      - run: pnpm --dir mod buildStandalone
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mod
          path: |
            mod/dist/desktop.asar
            mod/LICENSE
          if-no-files-found: error
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/configure.mjs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          path-type: inherit
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2
      - name: Compilar instaladores Windows x64
        working-directory: installer
        shell: msys2 {0}
        run: |
          go mod download
          go test -tags cli ./...
          go install github.com/tc-hib/go-winres@d743268d7ea168077ddd443c4240562d4f5e8c3e
          RESOURCE_VERSION="$(node -p "require('../package.json').version")"
          VERSION="v$RESOURCE_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
            RESOURCE_VERSION="${GITHUB_REF_NAME#v}"
          fi
          go-winres make --product-version "$RESOURCE_VERSION"
          HASH="$(git rev-parse --short HEAD)"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -tags 'static gui' -ldflags "-s -w -H=windowsgui -extldflags=-static -X equilotl/buildinfo.InstallerGitHash=$HASH -X equilotl/buildinfo.InstallerTag=$VERSION" -o ByaFluxInstaller.exe
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags cli -ldflags "-s -w -X equilotl/buildinfo.InstallerGitHash=$HASH -X equilotl/buildinfo.InstallerTag=$VERSION" -o ByaFluxInstallerCli.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installers
          path: installer/ByaFluxInstaller*.exe
          if-no-files-found: error
  linux:
    needs: [mod]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/configure.mjs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mod
          path: linux-bundle
      - name: Test and build stable Linux installers
        working-directory: installer
        run: |
          set -euo pipefail
          go test -tags cli ./...
          version="$(node -p "require('../package.json').version")"
          mkdir -p ../linux-installers
          for target in amd64:x86_64 arm64:aarch64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${target%:*}" go build -tags cli -ldflags "-s -w -X equilotl/buildinfo.InstallerGitHash=$GITHUB_SHA -X equilotl/buildinfo.InstallerTag=v$version" -o "../linux-installers/ByaFluxInstallerCli-Linux-${target#*:}"
          done
      - name: Verify Linux install and removal
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          binary="$(realpath linux-installers/ByaFluxInstallerCli-Linux-x86_64)"
          asar="$(realpath linux-bundle/dist/desktop.asar)"
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/discord/resources"
          printf 'original Discord test fixture' > "$fixture/discord/resources/app.asar"
          cp "$fixture/discord/resources/app.asar" "$fixture/original"
          export EQUICORD_DIRECTORY="$asar" EQUICORD_DEV_INSTALL=1 EQUICORD_USER_DATA_DIR="$fixture/config"
          export HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9
          "$binary" --version | tee "$fixture/version.txt"
          grep -F 'ByaFluxInstaller CLI' "$fixture/version.txt"
          "$binary" --install --location "$fixture/discord"
          test -f "$fixture/discord/resources/_app.asar"
          cmp "$fixture/original" "$fixture/discord/resources/_app.asar"
          "$binary" --uninstall --location "$fixture/discord"
          cmp "$fixture/original" "$fixture/discord/resources/app.asar"
          test ! -e "$fixture/discord/resources/_app.asar"
          printf 'PASS Linux CLI: install, loader backup, uninstall and byte-for-byte restoration.\n'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-installers
          path: linux-installers/*
          if-no-files-found: error
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [mod, installer, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release
          merge-multiple: true
      - name: Include current Android installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/include-mobile-release.py
      - name: Publicar versão completa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mod_version="$(node -p "require('./mod/package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "$mod_version"
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          fi

          mkdir -p publish
          cp release/dist/desktop.asar publish/desktop.asar
          cp release/LICENSE publish/LICENSE
          cp release/ByaFluxInstaller.exe publish/ByaFluxInstaller.exe
          cp release/ByaFluxInstallerCli.exe publish/ByaFluxInstallerCli.exe
          cp release/ByaFluxInstallerCli-Linux-* publish/
          release_files=(
            publish/desktop.asar
            publish/ByaFluxInstaller.exe
            publish/ByaFluxInstallerCli.exe
            publish/LICENSE
            publish/ByaFluxInstallerCli-Linux-x86_64
            publish/ByaFluxInstallerCli-Linux-aarch64
          )
          release_files+=(publish/ByaFluxMobile-*.apk)
          for file in "${release_files[@]}"; do
            test -s "$file"
          done

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${release_files[@]}" --clobber
          else
            gh release create "$tag" "${release_files[@]}" --target "$GITHUB_SHA" --draft --title "ByaFlux $GITHUB_SHA" --notes-file RELEASE_NOTES.md
          fi
          gh release edit "$tag" --draft=false --title "ByaFlux $GITHUB_SHA" --notes-file RELEASE_NOTES.md --latest
